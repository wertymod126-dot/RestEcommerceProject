spring.application.name=RestEcommerce

# --- Database ---
# Defaults match compose.yaml. To use another database, set the
# DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/ecommerce}
spring.datasource.username=${DB_USERNAME:ecommerce}
spring.datasource.password=${DB_PASSWORD:ecommerce}

# --- JPA / Hibernate ---
# Flyway creates the tables (src/main/resources/db/migration).
# "validate" only checks that entities match those tables and never changes them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Set to true to see the SQL Hibernate runs
spring.jpa.show-sql=false

# --- Errors ---
# Include the error message in error responses (helpful while learning)
server.error.include-message=always
